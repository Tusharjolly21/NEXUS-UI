<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Terminal Install</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Palette and type. Change these and the whole film follows. */
      :root {
        --ground: #000000;
        --ink: #f5f5f7;
        --muted: #86868b;
        --blue: #0a84ff;
        --green: #30d158;
        --window: #1c1c1e;
        --font: "Inter", "SF Pro Display", -apple-system, "Segoe UI", sans-serif;
        --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--ground); }

      /* A soft light behind everything, so the black has depth. */
      #glow { position: absolute; left: 50%; top: 52%; width: 1500px; height: 900px; margin: -450px 0 0 -750px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(10,132,255,0.22), rgba(191,90,242,0.10) 55%, transparent 100%); filter: blur(30px); }

      .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

      #intro h1 { font-size: 132px; line-height: 1.02; font-weight: 700; letter-spacing: -0.045em; }
      #intro p { margin-top: 28px; font-size: 40px; color: var(--muted); letter-spacing: -0.01em; }

      #term { position: absolute; left: 50%; top: 50%; width: 1500px; height: 480px; margin: -240px 0 0 -750px; border-radius: 28px;
        background: var(--window); box-shadow: 0 0 0 1.5px rgba(255,255,255,0.09), 0 60px 140px -30px rgba(0,0,0,0.9); overflow: hidden; }
      #bar { height: 76px; display: flex; align-items: center; gap: 14px; padding: 0 30px; border-bottom: 1.5px solid rgba(255,255,255,0.07); }
      #bar i { width: 20px; height: 20px; border-radius: 50%; display: block; }
      #bar b { margin-left: 18px; font-family: var(--mono); font-weight: 400; font-size: 28px; color: var(--muted); }
      #body { padding: 46px 56px; font-family: var(--mono); font-size: 38px; line-height: 1.5; white-space: nowrap; }
      .prompt { color: var(--green); margin-right: 20px; }
      #cmd { white-space: pre; }
      #caret { display: inline-block; width: 22px; height: 44px; margin-left: 4px; vertical-align: -8px; background: var(--ink); }
      .line { display: flex; align-items: center; gap: 20px; margin-top: 12px; color: #c7c7cc; }
      .tick { width: 36px; height: 36px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; flex: none; }
      .tick svg { width: 20px; height: 20px; }
      .path { color: var(--blue); }

      #outro h2 { font-size: 150px; font-weight: 700; letter-spacing: -0.05em;
        background: linear-gradient(90deg, #0a84ff, #bf5af2 55%, #ff375f); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #outro p { margin-top: 26px; font-size: 42px; color: var(--muted); letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="terminal-install" data-start="0" data-duration="10.5" data-width="1920" data-height="1080">
      <div id="glow" class="clip" data-start="0" data-duration="10.5" data-track-index="0"></div>

      <div id="intro" class="center clip" data-start="0" data-duration="2.6" data-track-index="1">
        <h1>Add motion<br />in one line.</h1>
        <p>Animated components for React</p>
      </div>

      <div id="term" class="clip" data-start="1.9" data-duration="6.0" data-track-index="2">
        <div id="bar">
          <i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
          <b>~/my-app</b>
        </div>
        <div id="body">
          <div><span class="prompt">&#10095;</span><span id="cmd"></span><span id="caret"></span></div>
          <div class="line" id="l1"><span class="tick"><svg viewBox="0 0 20 20" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg></span><span>Checking registry</span></div>
          <div class="line" id="l2"><span class="tick"><svg viewBox="0 0 20 20" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg></span><span>Installing dependencies</span></div>
          <div class="line" id="l3"><span class="tick"><svg viewBox="0 0 20 20" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg></span><span>Created 1 file: <span class="path">components/ui/slide-to-confirm.tsx</span></span></div>
        </div>
      </div>

      <!-- The soundtrack: every tick, whoosh and hit is placed on the same times as the animation below. -->
      <audio id="sound" data-start="0" data-duration="10.5" data-track-index="9" data-volume="1" src="terminal-install.mp3"></audio>

      <div id="outro" class="center clip" data-start="7.6" data-duration="2.9" data-track-index="3">
        <h2>nexus-ui.com</h2>
        <p>One command per component.</p>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var COMMAND = "npx shadcn@latest add @nexus-labs/slide-to-confirm";
      var tl = gsap.timeline({ paused: true });

      // Scene 1: the headline (0 to 2.6s)
      // The headline is already on screen at frame 0, so the first frame works as a thumbnail.
      tl.fromTo("#intro h1", { y: 24 }, { y: 0, duration: 1.1, ease: "power4.out" }, 0);
      tl.fromTo("#intro p", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.7);
      tl.to("#intro", { opacity: 0, scale: 0.96, filter: "blur(10px)", duration: 0.6, ease: "power2.in" }, 1.9);

      // Scene 2: the terminal rises and types (1.9 to 7.9s)
      tl.fromTo("#term", { opacity: 0, y: 120, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power4.out" }, 1.9);
      var typed = { n: 0 };
      tl.to(typed, {
        n: COMMAND.length, duration: 1.5, ease: "none",
        onUpdate: function () { document.getElementById("cmd").textContent = COMMAND.slice(0, Math.round(typed.n)); }
      }, 2.5);
      // The caret blinks on a fixed grid so seeking gives the same frame every time.
      var caret = { v: 1 };
      tl.to(caret, {
        v: 0, duration: 6.0, ease: "none",
        onUpdate: function () {
          var t = tl.time();
          var typing = t > 2.5 && t < 4.1;
          document.getElementById("caret").style.opacity = typing || Math.floor(t * 2) % 2 === 0 ? 1 : 0;
        }
      }, 1.9);
      ["#l1", "#l2", "#l3"].forEach(function (id, i) {
        tl.fromTo(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 4.1 + i * 0.3);
        tl.fromTo(id + " .tick", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 4.2 + i * 0.3);
      });
      tl.to("#term", { opacity: 0, y: -80, scale: 0.97, filter: "blur(12px)", duration: 0.6, ease: "power2.in" }, 7.3);

      // Scene 3: the end card (7.6 to 10.5s)
      tl.fromTo("#outro h2", { opacity: 0, y: 40, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power4.out" }, 7.7);
      tl.fromTo("#outro p", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 8.2);

      window.__timelines["terminal-install"] = tl;
    </script>
  </body>
</html>
