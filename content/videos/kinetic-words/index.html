<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kinetic Words</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Palette and type. Change these and the whole film follows. */
      :root {
        --ground: #f5f5f7;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --card: #ffffff;
        --font: "Inter", "SF Pro Display", -apple-system, "Segoe UI", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font); color: var(--ink); background: var(--ground); }

      .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

      /* Scene 1: four words, one after the other. */
      #words { gap: 6px; }
      .w { display: block; font-size: 230px; line-height: 0.98; font-weight: 800; letter-spacing: -0.06em; }
      .w.accent { background: linear-gradient(90deg, #0a84ff, #bf5af2 55%, #ff375f); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 14px; }

      /* Scene 2: the kinds of component, as cards that stack up. */
      #stack { gap: 26px; }
      #stack h2 { font-size: 76px; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 30px; }
      .card { width: 860px; height: 170px; border-radius: 44px; background: var(--card); box-shadow: 0 0 0 1.5px rgba(0,0,0,0.05), 0 30px 60px -30px rgba(0,0,0,0.25);
        display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
      .card span { font-size: 58px; font-weight: 650; letter-spacing: -0.03em; }
      .card em { font-style: normal; font-size: 40px; color: var(--muted); letter-spacing: -0.01em; }

      /* Scene 3: the end card. */
      #end h3 { font-size: 150px; font-weight: 800; letter-spacing: -0.055em; }
      #end p { margin-top: 28px; font-size: 54px; color: var(--muted); letter-spacing: -0.015em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="kinetic-words" data-start="0" data-duration="9.5" data-width="1080" data-height="1920">
      <div id="words" class="center clip" data-start="0" data-duration="3.2" data-track-index="0">
        <span class="w">Make</span>
        <span class="w">your</span>
        <span class="w">site</span>
        <span class="w accent">move.</span>
      </div>

      <div id="stack" class="center clip" data-start="3.0" data-duration="3.4" data-track-index="1">
        <h2>Ready for any page</h2>
        <div class="card"><span>Heroes</span><em>Blocks</em></div>
        <div class="card"><span>Pricing</span><em>Blocks</em></div>
        <div class="card"><span>Buttons</span><em>Components</em></div>
        <div class="card"><span>Cards</span><em>Components</em></div>
      </div>

      <!-- The soundtrack: every tick, whoosh and hit is placed on the same times as the animation below. -->
      <audio id="sound" data-start="0" data-duration="9.5" data-track-index="9" data-volume="1" src="kinetic-words.mp3"></audio>

      <div id="end" class="center clip" data-start="6.2" data-duration="3.3" data-track-index="2">
        <h3>nexus-ui.com</h3>
        <p>Animated components for React</p>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0 to 3.2s): the first word is on screen at frame 0, the rest land on the beat.
      tl.fromTo(".w:nth-child(1)", { y: 30 }, { y: 0, duration: 0.9, ease: "power4.out" }, 0);
      [2, 3, 4].forEach(function (n, i) {
        tl.fromTo(".w:nth-child(" + n + ")", { opacity: 0, y: 120, scale: 0.9, filter: "blur(18px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power4.out" }, 0.4 + i * 0.42);
      });
      tl.to("#words", { opacity: 0, y: -90, filter: "blur(16px)", duration: 0.55, ease: "power2.in" }, 2.65);

      // Scene 2 (3.0 to 6.4s): a heading, then four cards drop in and settle.
      tl.fromTo("#stack h2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.1);
      tl.fromTo(".card", { opacity: 0, y: 220, scale: 0.92, rotation: function (i) { return i % 2 ? 3 : -3; } },
        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.85, ease: "back.out(1.5)", stagger: 0.2 }, 3.4);
      tl.to("#stack", { opacity: 0, scale: 0.94, filter: "blur(14px)", duration: 0.55, ease: "power2.in" }, 5.85);

      // Scene 3 (6.2 to 9s): the end card.
      tl.fromTo("#end h3", { opacity: 0, y: 50, filter: "blur(16px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power4.out" }, 6.45);
      tl.fromTo("#end p", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 6.95);

      window.__timelines["kinetic-words"] = tl;
    </script>
  </body>
</html>
