<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectra Frame</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #0d0d14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }

    /* ── Wrapper ──────────────────────────────────────────── */
    .sf-wrap {
      width: 100%;
      max-width: 1100px;
      padding: 16px;
    }

    /* ── Grid ────────────────────────────────────────────── */
    .sf-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      /* No explicit height — rows form naturally via flex-wrap */
    }

    /* ── Cell ────────────────────────────────────────────── */
    .sf-cell {
      flex: 1 1 calc(20% - 10px);
      min-height: 140px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      /* Pre-promote to GPU layer before hover fires — no first-hover stutter */
      transform: translateZ(0);
      transition:
        flex       0.55s cubic-bezier(0.4, 0, 0.2, 1),
        min-height 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Image ───────────────────────────────────────────── */
    .sf-cell img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      /* Default: full grayscale */
      filter: grayscale(100%) brightness(0.85);
      transform: scale(1) translateZ(0);
      will-change: filter, transform;
      backface-visibility: hidden;
      transition:
        filter    0.55s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Inset glow ring (hovered only) ─────────────────── */
    .sf-cell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18) inset;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Hovered cell ────────────────────────────────────── */
    .sf-grid.has-hover .sf-cell.hovered {
      flex: 2.8 1 calc(36% - 10px);
      min-height: 200px;
      z-index: 2;
    }

    .sf-grid.has-hover .sf-cell.hovered img {
      filter: grayscale(0%) brightness(1.05);
      transform: scale(1.04) translateZ(0);
    }

    .sf-grid.has-hover .sf-cell.hovered::after {
      opacity: 1;
    }

    /* ── Dimmed cells (not hovered, but grid has a hover) ── */
    .sf-grid.has-hover .sf-cell:not(.hovered) img {
      filter: grayscale(100%) brightness(0.65);
    }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      .sf-cell {
        flex: 1 1 calc(50% - 10px);
        min-height: 110px;
      }

      .sf-grid.has-hover .sf-cell.hovered {
        flex: 2 1 calc(65% - 10px);
      }
    }
  </style>
</head>
<body>
  <div class="sf-wrap">
    <div class="sf-grid" id="sfGrid">
      <!-- 15 cells — picsum seeds keep images stable across reloads -->
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf1/800/600"  alt="Photo 1"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf2/800/600"  alt="Photo 2"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf3/800/600"  alt="Photo 3"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf4/800/600"  alt="Photo 4"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf5/800/600"  alt="Photo 5"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf6/800/600"  alt="Photo 6"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf7/800/600"  alt="Photo 7"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf8/800/600"  alt="Photo 8"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf9/800/600"  alt="Photo 9"  loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf10/800/600" alt="Photo 10" loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf11/800/600" alt="Photo 11" loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf12/800/600" alt="Photo 12" loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf13/800/600" alt="Photo 13" loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf14/800/600" alt="Photo 14" loading="lazy" /></div>
      <div class="sf-cell"><img src="https://picsum.photos/seed/sf15/800/600" alt="Photo 15" loading="lazy" /></div>
    </div>
  </div>

  <script>
    const grid  = document.getElementById("sfGrid");
    const cells = Array.from(grid.querySelectorAll(".sf-cell"));

    cells.forEach((cell) => {
      cell.addEventListener("mouseenter", () => {
        grid.classList.add("has-hover");
        cell.classList.add("hovered");
      });

      cell.addEventListener("mouseleave", () => {
        cell.classList.remove("hovered");
        // Only remove has-hover when no cell remains hovered.
        // requestAnimationFrame lets the browser settle before checking,
        // preventing a brief flash when moving quickly between cells.
        requestAnimationFrame(() => {
          if (!grid.querySelector(".sf-cell.hovered")) {
            grid.classList.remove("has-hover");
          }
        });
      });
    });
  </script>
</body>
</html>
